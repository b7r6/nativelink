---
name: Cargo Native

# Two-tier cadence. On pull_request only the Ubuntu cargo target runs, for
# fast contributor feedback. The expensive Windows native-compile target --
# the only CI lane with no Bazel/Nix path -- is deferred to the merge queue
# (post-approval, pre-merge) so it still gates every commit that lands on
# main, plus push-to-main and a daily cron as backstops. A Windows-cargo-only
# break is therefore caught at merge time rather than on the PR push; the
# merge_group trigger requires a merge queue enabled on the branch.
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/styles/**'
      - 'web/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/styles/**'
      - 'web/**'
  merge_group:
  schedule:
    # Daily backstop so toolchain/dependency drift surfaces within a day.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  RUSTFLAGS: -Dwarnings
  # aws-lc-sys (JWT signing for GCS auth) assembles with NASM on x86_64
  # Windows, which the runner image does not ship. Use the prebuilt objects
  # the crate carries instead; the variable is ignored on every other target.
  AWS_LC_SYS_PREBUILT_NASM: 1

jobs:
  cargo-native:
    strategy:
      fail-fast: false
      matrix:
        # pull_request: Ubuntu only (fast feedback). Other events add the
        # expensive Windows native-compile target.
        os: >-
          ${{ github.event_name == 'pull_request'
              && fromJSON('["ubuntu-24.04"]')
              || fromJSON('["ubuntu-24.04", "windows-2022"]') }}
        # Pin to the committed MSRV instead of floating `stable`. Floating
        # stable drifts ahead of the crate's rust-version and turns new
        # deprecation lints into hard build errors (e.g. atomic fetch_update
        # -> try_update), reddening the lane for a toolchain reason unrelated
        # to the change under test. The MSRV is the contract the crate pins.
        toolchain: ['1.97.1']
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # Ubuntu 24.04 restricts unprivileged user namespaces by default, which breaks
      # the worker tests that use namespaces (e.g. for sandboxing).
      - name: Disable AppArmor namespace restrictions
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        if: matrix.os == 'ubuntu-24.04'

      - name: Set up Rust toolchain
        run: rustup update && rustup default ${{ matrix.toolchain }}

      - name: Rust cache
        uses: >- # v2.9.1
          Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Build on ${{ runner.os }}
        run: cargo build --all --profile=smol

      - name: Test on ${{ runner.os }}
        run: cargo test --all --profile=smol

      - name: Check schema export
        run: cargo run --bin build-schema --features dev-schema --package nativelink-config
