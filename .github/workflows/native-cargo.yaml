---
name: Cargo Native

# Cargo Native is the only CARGO-ONLY lane in CI: ubuntu + windows both run
# `cargo build/test` with no Bazel equivalent. Windows is an irreducible
# native compile (~9m) with NO bazel/nix path, so it alone gates per-PR
# commit-to-verification at ~15m.
#
# Per directive this lane is moved OFF the per-PR hot path: it runs on push
# to main (post-merge), on a daily cadence, via workflow_dispatch, and on the
# experiment branches. It no longer runs on pull_request.
#
# TRADEOFF (honest): a cargo-only / Windows-only break (build-system
# divergence Bazel does not catch) now reaches main BEFORE detection and is
# caught on the main-push run, not pre-merge — requiring a revert to green
# main. The strictly-safer variant is a merge queue (`merge_group:`): it runs
# this lane after approval but BEFORE the commit lands, keeping main green.
# Merge-queue is the RECOMMENDED hardening; main-only is implemented per
# directive.
on:
  push:
    branches: [main, 'ci/win-x-**']
    paths-ignore:
      - '.github/styles/**'
      - 'web/**'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  # NOTE: intentionally NO `pull_request:` trigger. See header above.

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  RUSTFLAGS: -Dwarnings
  # aws-lc-sys (JWT signing for GCS auth) assembles with NASM on x86_64
  # Windows, which the runner image does not ship. Use the prebuilt objects
  # the crate carries instead; the variable is ignored on every other target.
  AWS_LC_SYS_PREBUILT_NASM: 1

jobs:
  cargo-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        toolchain: [stable]
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # Ubuntu 24.04 restricts unprivileged user namespaces by default, which breaks
      # the worker tests that use namespaces (e.g. for sandboxing).
      - name: Disable AppArmor namespace restrictions
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        if: matrix.os == 'ubuntu-24.04'

      - name: Set up Rust toolchain
        run: rustup update && rustup default ${{ matrix.toolchain }}

      - name: Rust cache
        uses: >- # v2.9.1
          Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          prefix-key: "exp-mainonly"

      - name: Build on ${{ runner.os }}
        run: cargo build --all --profile=smol

      - name: Test on ${{ runner.os }}
        run: cargo test --all --profile=smol

      - name: Check schema export
        run: cargo run --bin build-schema --features dev-schema --package nativelink-config
