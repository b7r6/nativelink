---
name: Cargo Native

# Opinionated per-PR CI scope: the Cargo build system is validated on every
# push to main (and on demand via workflow_dispatch), not on every PR push.
# Per-PR correctness coverage comes from the Bazel lanes, which build and
# test the same sources against the remote cache; this workflow exists to
# catch Cargo-specific build-system divergence (Cargo.toml/lock drift,
# cargo-only cfg paths, the Windows native toolchain), which a code PR
# cannot usually affect but every main push re-proves. Tradeoff owned in
# the PR introducing this: a cargo-only break is caught at main rather
# than pre-merge; a merge queue is the stricter variant if main must never
# redden.
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/styles/**'
      - 'web/**'
  schedule:
    # Daily backstop so the lane keeps proving the Cargo build even when
    # main is quiet (toolchain or dependency drift shows up within a day).
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  RUSTFLAGS: -Dwarnings
  # aws-lc-sys (JWT signing for GCS auth) assembles with NASM on x86_64
  # Windows, which the runner image does not ship. Use the prebuilt objects
  # the crate carries instead; the variable is ignored on every other target.
  AWS_LC_SYS_PREBUILT_NASM: 1

jobs:
  cargo-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        # Pin to the committed MSRV instead of floating `stable`. Floating
        # stable drifts ahead of the crate's rust-version and turns new
        # deprecation lints into hard build errors (e.g. atomic fetch_update
        # -> try_update), reddening the lane for a toolchain reason unrelated
        # to the change under test. The MSRV is the contract the crate pins.
        toolchain: ['1.97.1']
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # Ubuntu 24.04 restricts unprivileged user namespaces by default, which breaks
      # the worker tests that use namespaces (e.g. for sandboxing).
      - name: Disable AppArmor namespace restrictions
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        if: matrix.os == 'ubuntu-24.04'

      - name: Set up Rust toolchain
        run: rustup update && rustup default ${{ matrix.toolchain }}

      - name: Rust cache
        uses: >- # v2.9.1
          Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4

      - name: Build on ${{ runner.os }}
        run: cargo build --all --profile=smol

      - name: Test on ${{ runner.os }}
        run: cargo test --all --profile=smol

      - name: Check schema export
        run: cargo run --bin build-schema --features dev-schema --package nativelink-config
