---
name: Cargo Native

# MERGE-QUEUE variant (recommended hardening over main-only): Cargo Native
# runs in the merge queue (after approval, BEFORE the commit lands on main)
# plus main-push and a daily cadence. On pull_request only the Ubuntu cargo
# target runs for fast feedback; the expensive Windows target is deferred to
# the merge queue. This keeps main green (catches cargo-only breaks pre-merge)
# while removing Windows from the per-PR hot path.
on:
  merge_group:
  push:
    branches: [main, 'ci/win-x-**']
    paths-ignore:
      - '.github/styles/**'
      - 'web/**'
  schedule:
    - cron: '0 6 * * *'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/styles/**'
      - 'web/**'

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  RUSTFLAGS: -Dwarnings
  # aws-lc-sys (JWT signing for GCS auth) assembles with NASM on x86_64
  # Windows, which the runner image does not ship. Use the prebuilt objects
  # the crate carries instead; the variable is ignored on every other target.
  AWS_LC_SYS_PREBUILT_NASM: 1

jobs:
  cargo-native:
    strategy:
      fail-fast: false
      matrix:
        # pull_request: Ubuntu only (fast feedback). merge_group/push/schedule:
        # full matrix including the expensive Windows target.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-24.04"]') || fromJSON('["ubuntu-24.04", "windows-2022"]') }}
        toolchain: [stable]
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # Ubuntu 24.04 restricts unprivileged user namespaces by default, which breaks
      # the worker tests that use namespaces (e.g. for sandboxing).
      - name: Disable AppArmor namespace restrictions
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        if: matrix.os == 'ubuntu-24.04'

      - name: Set up Rust toolchain
        run: rustup update && rustup default ${{ matrix.toolchain }}

      - name: Rust cache
        uses: >- # v2.9.1
          Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          prefix-key: "exp-mq"

      - name: Build on ${{ runner.os }}
        run: cargo build --all --profile=smol

      - name: Test on ${{ runner.os }}
        run: cargo test --all --profile=smol

      - name: Check schema export
        run: cargo run --bin build-schema --features dev-schema --package nativelink-config
