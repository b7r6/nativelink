---
name: Bazel Native

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/styles/**'
      - 'web/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/styles/**'
      - 'web/**'

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Compute whether the Bazel 8 source-compatibility lane can be affected by
  # this diff. That lane runs with --lockfile_mode=off and cannot use the
  # Bazel-9-keyed remote cache (it rebuilds from source, ~2x the Bazel 9
  # lane), yet it only validates that the sources still build under the older
  # Bazel. A pure code PR that does not touch the module graph, bazelrc, or
  # toolchains cannot change that answer, so the lane is gated off for those.
  # Pushes to main always run it (backstop) so nothing merges unvalidated.
  changes:
    name: Compute affected Bazel lanes
    runs-on: ubuntu-24.04
    outputs:
      unit-tests-matrix: ${{ steps.matrix.outputs.include }}
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Filter Bazel-8-affecting paths
        # Only meaningful on pull requests; pushes to main always run the
        # full matrix below, so the filter is skipped there.
        if: github.event_name == 'pull_request'
        uses: >- # v3.0.2
          dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: filter
        with:
          filters: |
            bazel8:
              - 'MODULE.bazel'
              - 'MODULE.bazel.lock'
              - '*.bazelrc'
              - '**/BUILD.bazel'
              - '**/BUILD'
              - '**/*.bzl'
              - 'tools/**'
              - 'local-remote-execution/**'
              - '.github/workflows/native-bazel.yaml'
              - '.github/actions/**'
      - name: Compose unit-tests matrix
        # The gating must live inside this always-running job: a job-level
        # `if` cannot see the `matrix` context, and a skipped required job
        # would leave the check pending forever.
        id: matrix
        shell: bash
        run: |
          # Keep the existing required check name on the project-pinned Bazel.
          bazel9='{"os":"ubuntu-24.04","bazel_version":"9.1.1","check_name":"ubuntu-24.04"}'
          # Deterministic Bazel compatibility lane. Bazel 8 cannot read the
          # Bazel 9 lockfile format, so this lane tests source compatibility
          # without enforcing the committed MODULE.bazel.lock.
          bazel8='{"os":"ubuntu-24.04","bazel_version":"8.7.0","check_name":"ubuntu-24.04 / Bazel 8.7.0"}'
          if [ "${{ github.ref }}" = "refs/heads/main" ] \
            || [ "${{ steps.filter.outputs.bazel8 }}" = "true" ]; then
            echo "include=[${bazel9},${bazel8}]" >> "$GITHUB_OUTPUT"
          else
            echo "include=[${bazel9}]" >> "$GITHUB_OUTPUT"
          fi

  unit-tests:
    needs: [changes]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.unit-tests-matrix) }}
    name: ${{ matrix.check_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel_version }}
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Free disk space
        uses: ./.github/actions/free-disk

      - name: Setup NativeLink Cloud
        id: setup-nativelink-cloud
        uses: ./.github/actions/setup-nativelink-cloud
        with:
          ci-mode: ${{ vars.NATIVELINK_CI_MODE }}
          claim-base: ${{ secrets.NATIVELINK_STAGING_CLAIM_BASE }}
          bes-results-url: ${{ secrets.NATIVELINK_STAGING_BES_RESULTS_URL }}
          api-key: >-
            ${{ github.event_name == 'push'
                && secrets.NATIVELINK_STAGING_API_KEY_RW
                || secrets.NATIVELINK_STAGING_API_KEY_RO }}
          mode: ${{ github.event_name == 'push' && 'write' || 'read' }}
          # Remote execution only on Linux; the action hard-fails exec on
          # non-Linux runners, so macOS lanes fall back to cache.
          exec: ${{ runner.os == 'Linux' && 'on' || 'off' }}

      - name: Setup Bazel
        uses: >- # v0.19.0
          bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-cache: true
          repository-cache: true
          # Only enable when we don't have remote cache, otherwise it just gets very slow
          # and enormous
          disk-cache: ${{ steps.setup-nativelink-cloud.outputs.enabled == 'false'}}

      - name: Show Bazel version
        run: bazel --version

      - name: Run Bazel tests
        run: |
          if [ "$RUNNER_OS" == "Linux" ] || [ "$RUNNER_OS" == "macOS" ]; then
            if [ "${{ matrix.bazel_version }}" == "8.7.0" ]; then
              # Bazel 8 cannot parse the Bazel 9 MODULE.bazel.lock format.
              bazel test //... \
                --lockfile_mode=off \
                --extra_toolchains=@rust_toolchains//:all \
                --verbose_failures
            else
              bazel test //... \
                --lockfile_mode=error \
                --extra_toolchains=@rust_toolchains//:all \
                --verbose_failures
            fi
          elif [ "$RUNNER_OS" == "Windows" ]; then
            bazel \
              --lockfile_mode=error \
              --output_user_root=${{ steps.bazel-cache.outputs.mountpoint }} \
              test \
              --config=windows \
              //... \
              --verbose_failures
          else
            echo "Unknown runner OS: $RUNNER_OS"
            exit 1
          fi

  redis-store-tester:
    name: Redis store tester
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: >- # v6.0.2
          actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Free disk space
        uses: ./.github/actions/free-disk

      - uses: hoverkraft-tech/compose-action@11beaa1c2dae4e8ed7b1665aa074723b6cecb0e4 # v3.0.0
        with:
          compose-file: src/bin/docker-compose.store-tester.yaml

      - name: Setup NativeLink Cloud
        id: setup-nativelink-cloud
        uses: ./.github/actions/setup-nativelink-cloud
        with:
          ci-mode: ${{ vars.NATIVELINK_CI_MODE }}
          claim-base: ${{ secrets.NATIVELINK_STAGING_CLAIM_BASE }}
          bes-results-url: ${{ secrets.NATIVELINK_STAGING_BES_RESULTS_URL }}
          api-key: >-
            ${{ github.event_name == 'push'
                && secrets.NATIVELINK_STAGING_API_KEY_RW
                || secrets.NATIVELINK_STAGING_API_KEY_RO }}
          mode: ${{ github.event_name == 'push' && 'write' || 'read' }}
          # Remote execution only on Linux; the action hard-fails exec on
          # non-Linux runners, so macOS lanes fall back to cache.
          exec: ${{ runner.os == 'Linux' && 'on' || 'off' }}

      - name: Setup Bazel
        uses: >- # v0.19.0
          bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86
        with:
          bazelisk-cache: true
          repository-cache: true
          # Only enable when we don't have remote cache, otherwise it just gets very slow
          # and enormous
          disk-cache: ${{ steps.setup-nativelink-cloud.outputs.enabled == 'false'}}

      - name: Run Store tester with sentinel
        run: |
          bazel run //:redis_store_tester \
            --lockfile_mode=error \
            --extra_toolchains=@rust_toolchains//:all \
            --verbose_failures -- --redis-mode sentinel --mode sequential
        env:
          RUST_LOG: trace
          REDIS_HOST: localhost
          MAX_LOOPS: 10 # running sequentially just to test all the actions work

      - name: Run Store tester with standard
        run: |
          bazel run //:redis_store_tester \
            --lockfile_mode=error \
            --extra_toolchains=@rust_toolchains//:all \
            --verbose_failures -- --redis-mode standard --mode sequential
        env:
          RUST_LOG: trace
          REDIS_HOST: localhost
          MAX_LOOPS: 10 # running sequentially just to test all the actions work

      - name: Run Store tester with cluster
        run: |
          bazel run //:redis_store_tester \
            --lockfile_mode=error \
            --extra_toolchains=@rust_toolchains//:all \
            --verbose_failures -- --redis-mode cluster --mode sequential
        env:
          RUST_LOG: trace
          REDIS_HOST: localhost
          MAX_LOOPS: 10 # running sequentially just to test all the actions work
