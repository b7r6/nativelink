#:schema ../tools/cargo-with-detailed-deps.json
lints.workspace = true

[package]
description = "OCI toolchain bridge for NativeLink — pulls OCI images, produces REAPI Directory projections"
edition = "2024"
name = "nativelink-oci"
version = "1.5.2"

[dependencies]
nativelink-error = { path = "../nativelink-error" }
nativelink-proto = { path = "../nativelink-proto" }
nativelink-util = { path = "../nativelink-util" }

blake3 = { version = "1.8.0", default-features = false }
bytes = { version = "1.10.1", default-features = false }
flate2 = { version = "1.1.1", default-features = false, features = ["zlib-ng"] }
hex = { version = "0.4.3", default-features = false, features = ["std"] }
prost = { version = "0.13.5", default-features = false }
reqwest = { version = "0.12.15", default-features = false, features = [
  "json",
  "rustls-tls",
  "stream",
] }
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.140", default-features = false, features = [
  "std",
] }
sha2 = { version = "0.10.8", default-features = false }
tar = { version = "0.4.44", default-features = false }
tracing = { version = "0.1.41", default-features = false }

[dev-dependencies]
