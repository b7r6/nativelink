[package]
edition = "2024"
name = "nativelink-canonical-filesystem"
publish = false
rust-version = "1.97.1"
version = "0.0.0"

# An experiment, independent of server construction and the pure parser.
[workspace]

[profile.smol]
debug = false
inherits = "dev"
opt-level = "z"
strip = true

[features]
redb = ["dep:redb"]

[dependencies]
nativelink-canonical-config = { path = "../canonical-config" }
redb = { version = "=4.4.0", features = [
  "std",
], default-features = false, optional = true }
rustix = { version = "=1.1.2", features = ["fs"] }
serde = { version = "=1.0.228", default-features = false, features = [
  "derive",
  "std",
] }
serde_json = { version = "=1.0.150", default-features = false, features = [
  "std",
] }
sha2 = { version = "=0.10.9", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
nursery = "deny"
pedantic = "deny"
too_many_lines = { level = "allow", priority = 1 }
