[package]
edition = "2024"
name = "nativelink-canonical-store"
publish = false
rust-version = "1.97.1"
version = "0.0.0"

[workspace]

[profile.smol]
debug = false
inherits = "dev"
opt-level = "z"
strip = true

[dependencies]
async-trait = "0.1.88"
bytes = "1.10.1"
futures = "0.3.31"
nativelink-canonical-config = { path = "../canonical-config" }
nativelink-canonical-filesystem = { path = "../canonical-filesystem" }
nativelink-error = { path = "../../nativelink-error" }
nativelink-metric = { path = "../../nativelink-metric" }
nativelink-util = { path = "../../nativelink-util" }
tokio = { version = "1.52.2", features = ["macros", "rt-multi-thread", "sync"] }
uuid = { version = "1.16.0", features = ["v4"] }

[dev-dependencies]
hyper-util = { version = "0.1.11", features = ["tokio"] }
nativelink-config = { path = "../../nativelink-config" }
nativelink-macro = { path = "../../nativelink-macro" }
nativelink-proto = { path = "../../nativelink-proto" }
nativelink-service = { path = "../../nativelink-service" }
nativelink-store = { path = "../../nativelink-store" }
opentelemetry = "0.32.0"
tokio-stream = "0.1.17"
tonic = { version = "0.14.0", features = ["router", "transport"] }
tower = "0.5.2"
tracing = "0.1.41"
tracing-test = { version = "0.2.5", features = ["no-env-filter"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"

[package.metadata.cargo-machete]
ignored = ["tracing", "tracing-test"]
