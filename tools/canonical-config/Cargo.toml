[package]
edition = "2024"
name = "nativelink-canonical-config"
publish = false
rust-version = "1.97.1"
version = "0.0.0"

# Deliberately independent of the server workspace and its legacy dependency
# closure. The legacy DTO/converter is compiled into the offline binary only.
[workspace]

[profile.smol]
debug = false
inherits = "dev"
opt-level = "z"
strip = true

[dependencies]
serde = { version = "=1.0.228", default-features = false, features = [
  "derive",
  "std",
] }
serde_json = { version = "=1.0.150", default-features = false, features = [
  "std",
] }
serde_json5 = { version = "=0.2.1", default-features = false }

[[bin]]
name = "experimental-canonical-convert"
path = "src/bin/convert.rs"

[lints.rust]
unreachable_pub = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
missing_errors_doc = { level = "allow", priority = 1 }
missing_panics_doc = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
nursery = "deny"
pedantic = "deny"
too_many_lines = { level = "allow", priority = 1 }

# Match the repository override: this nursery lint conflicts with the explicit
# visibility required by unreachable_pub in binary-only private modules.
redundant_pub_crate = { level = "allow", priority = 1 }
