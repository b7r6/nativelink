[default.extend-words]
# `conly_flags` in lre-cc
conly = "conly"
# in-toto attestation format used by SLSA provenance (`*.intoto.jsonl`)
intoto = "intoto"

[default]
# Old wrong spelling support
extend-ignore-re = [
  "alias = \"Cachable\"",
  "old_unique_qualifier_cachable_works",
  # Long base64 tokens (ed25519 keys/signatures in Nix test fixtures)
  "[A-Za-z0-9+/]{24,}={0,2}",
  # nix32-encoded hashes (Nix store path hashes and NAR hashes)
  "[0-9a-df-np-sv-z]{32,}",
]

[files]
extend-exclude = [
  # Covered by Vale
  "*.md",
  ".git/*",
  ".github/styles/*",
  "kubernetes/vendor/olm/*",
  "nativelink-proto/*",
  "web/*",
  # Contains old wrongly spelt data
  "nativelink-util/tests/data/*.json",
]
ignore-hidden = false
