[default.extend-words]
# `conly_flags` in lre-cc
conly = "conly"
# in-toto attestation format used by SLSA provenance (`*.intoto.jsonl`)
intoto = "intoto"

[default.extend-identifiers]
# POSIX ancillary-message control-buffer length; this is a libc field.
msg_controllen = "msg_controllen"
# rustix's POSIX write-only open flag.
WRONLY = "WRONLY"

[default]
# Old wrong spelling support
extend-ignore-re = [
  "alias = \"Cachable\"",
  "old_unique_qualifier_cachable_works",
]

[files]
extend-exclude = [
  # Covered by Vale
  "*.md",
  ".git/*",
  ".github/styles/*",
  "kubernetes/vendor/olm/*",
  "nativelink-proto/*",
  "web/*",
  # Contains old wrongly spelt data
  "nativelink-util/tests/data/*.json",
  # Raw operating-system observations preserve the observed process names.
  "nativelink-scheduler/design/categorical/evidence/*/ambient-processes.json",
  # Exact external qualification metadata includes a target-directory hash.
  "nativelink-scheduler/design/categorical/evidence/receipt-retirement/independent-differential/manifest.json",
  # Generated from the site, the blog and the docs corpus (all covered or
  # excluded above); regenerated, never edited.
  "llms-full.txt",
  "llms-small.txt",
  "llms.txt",
]
ignore-hidden = false
